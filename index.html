<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f4ec">
<title>🌱 100일 습관 챌린지</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f4ec}
#habitApp{display:block;width:100%;height:100vh;height:100dvh;border:0;background:#f7f4ec}
#shareError{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:20;max-width:calc(100% - 32px);padding:11px 14px;border-radius:12px;background:#37372f;color:#fff;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Noto Sans KR","Segoe UI",sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.18);display:none;text-align:center}
</style>
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.8.2/kakao.min.js" integrity="sha384-zt/G7/KfaRQ9dT/QIkS0ujMtzouJqzuSJcXVQu50x0rl/+mD1dc70AeOejVbMD9E" crossorigin="anonymous"></script>
</head>
<body>
<iframe id="habitApp" src="https://script.google.com/macros/s/AKfycbwf1dFoanjxIAWUVg8t78HhKexhVmrKjjYqyR5JCqWSnkLYk64nQTQAzGcgcUrdcUF6Yg/exec" allow="camera; clipboard-write" title="100일 습관 챌린지"></iframe>
<div id="shareError"></div>
<script>
const KAKAO_JS_KEY='cd14bd767fca3a01de16e43218e1b726';
const DEFAULT_CHALLENGE_URL='https://buly.kr/6XpBAsH';
const frame=document.getElementById('habitApp');
const errorBox=document.getElementById('shareError');
function showError(message){
  errorBox.textContent=message; errorBox.style.display='block';
  clearTimeout(showError.timer);
  showError.timer=setTimeout(()=>errorBox.style.display='none',3500);
}
function ensureKakao(){
  if(!window.Kakao) throw new Error('Kakao SDK not loaded');
  if(!Kakao.isInitialized()) Kakao.init(KAKAO_JS_KEY);
}
window.addEventListener('message',function(event){
  if(event.source!==frame.contentWindow) return;
  const data=event.data||{};
  if(data.type!=='HABIT100_KAKAO_SHARE') return;
  try{
    ensureKakao();
    const url=data.challengeUrl||DEFAULT_CHALLENGE_URL;
    Kakao.Share.sendDefault({
      objectType:'text',
      text:String(data.text||''),
      link:{mobileWebUrl:url,webUrl:url},
      buttonTitle:'🌱 100일 습관 챌린지 열기'
    });
  }catch(err){
    console.error(err);
    showError('카카오톡 공유창을 열지 못했어요. 잠시 후 다시 시도해 주세요.');
  }
});
</script>
</body>
</html>
